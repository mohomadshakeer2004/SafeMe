name: safe_me
description: Safe Me police Complain Application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.7
  # Bumps transitive impls (easy_localization pins older shared_preferences) for AGP 8+ namespace.
  shared_preferences: ^2.5.5
  provider: ^6.1.2
  flutter_spinkit: ^5.2.1
  flutter_form_builder: ^10.0.1
  flutter_svg: ^2.0.10+1
  flutter_easyloading: ^3.0.5
  rflutter_alert: ^2.0.7
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  font_awesome_flutter: ^10.7.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  video_player: ^2.9.2
  flutter_map_marker_cluster: ^1.4.0
  flutter_map: ^7.0.2
  fluster: ^1.2.0
  pull_to_refresh: ^2.0.0
  carousel_slider: ^5.0.0
  flutter_slidable: ^3.1.2
  open_file: ^3.5.10
  path_provider: ^2.1.5
  pdf: ^3.11.1
  url_launcher: ^6.3.1
  flutter_phone_direct_caller: ^2.2.1
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  fluttertoast: ^8.2.8
  motion_toast: ^2.11.0
  dio: ^5.4.1
  firebase_database: ^11.2.0
  firebase_storage: ^12.3.7
  flutter_sound: ^9.16.3
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  shake: ^3.0.0
  cupertino_icons: ^1.0.6
  audioplayers: ^6.1.0

# Aligned with epic_dbp_ub (Union Bank) where applicable.
dependency_overrides:
  intl: 0.20.2
  path: 1.9.1

dev_dependencies:
  auto_route_generator: ^9.0.0
  build_runner: ^2.5.4
  json_serializable: ^6.8.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
#    - assets/sound/
    - assets/icons/
    - assets/translations/

  fonts:
    - family: Poppins-Bold
      fonts:
        - asset: fonts/Poppins-Bold.ttf
    - family: Poppins-Regular
      fonts:
        - asset: fonts/Poppins-Regular.ttf
    - family: Poppins-Light
      fonts:
        - asset: fonts/Poppins-Light.ttf
    - family: Poppins-Medium
      fonts:
        - asset: fonts/Poppins-Medium.ttf
    - family: ARLRDBD
      fonts:
        - asset: fonts/ARLRDBD.ttf
